# Cuts a release whenever a version tag is pushed. The tag has to match
# Smith::VERSION, so a release can never ship code that identifies itself
# differently. Specs and formatting run in CI on every PR; a tag is only ever
# pushed from a merged branch, so this workflow builds rather than re-tests.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  guard:
    name: tag matches Smith::VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare the tag against src/smith/version.cr
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if ! grep -q "VERSION = \"$expected\"" src/smith/version.cr; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Smith::VERSION in src/smith/version.cr"
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest # arm64
            target: darwin-arm64
          - os: macos-15-intel # x86_64, native — no cross-compilation
            target: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Build the release binary
        env:
          # Read at compile time by src/smith/version.cr and set nowhere else.
          # It is what lets `smith update` tell a binary CI attached to a
          # release from one somebody built out of a working tree — and refuse
          # to overwrite the latter.
          SMITH_BUILD_CHANNEL: release
        run: mkdir -p bin && crystal build src/smith.cr --release -o bin/smith

      - name: Ad-hoc sign the binary (macOS)
        if: runner.os == 'macOS'
        run: codesign -s - --force bin/smith

      - name: Pack the archive
        run: |
          cd bin
          tar -czf smith-${{ github.ref_name }}-${{ matrix.target }}.tar.gz smith

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: smith-${{ github.ref_name }}-${{ matrix.target }}
          path: bin/smith-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract this version's entry from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" ver "]") > 0; next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "See CHANGELOG.md." > release_notes.md

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: smith-${{ github.ref_name }}-*
          # Flattened into dist/ so the checksums below name the assets exactly
          # as the release serves them; one archive per subdirectory would put
          # the directory into the file and `smith update` would never match it.
          merge-multiple: true
          path: dist

      - name: Checksum the archives
        working-directory: dist
        # `smith update` verifies the archive it downloaded against this before
        # it replaces anything. This job runs on ubuntu, so it is sha256sum —
        # macOS would need `shasum -a 256`, and the output formats differ.
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
